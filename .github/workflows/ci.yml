name: ReleaseRadar CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    
    # 1. Setup the ephemeral PostgreSQL database for tests
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download your source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js for your backend and frontend servers
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Setup .NET 10 for your C# Playwright tests
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      # Step 4: Install ALL dependencies (Root, Backend, and Frontend) to prevent Vite errors
      - name: Install Frontend/Backend Dependencies
        run: |
          npm ci
          cd backend
          npm install
          cd ../frontend
          npm install

      # Step 5: Seed the temporary test database with mock projects
      - name: Seed Test Database
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        run: node backend/seed.mjs

      # Step 6: Compile the C# test project
      - name: Build C# Tests
        run: dotnet build ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 7: Install Playwright browsers based on the compiled .NET 10 project
      - name: Install Playwright Browsers
        run: pwsh ReleaseRadar.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      # Step 8: Build your application's Docker container using your project's Dockerfile
      - name: Build Docker Image
        run: docker build -t releaseradar-app .

      # Step 9: Start your Docker container in the background (-d flag)
      - name: Run Application Container
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          JWT_SECRET: ci_test_secret
        run: |
          docker run -d -p 5173:5173 -p 5000:5000 -e DATABASE_URL="${{ env.DATABASE_URL }}" -e JWT_SECRET="${{ env.JWT_SECRET }}" --name live-app releaseradar-app

      # Step 10: Wait for the container to boot, then run the C# tests
      - name: Run E2E Tests
        run: |
          # Wait for the frontend to be ready with a 60-second timeout to prevent hanging
          npx wait-on -t 60000 http://localhost:5173 || sleep 5
          
          # Execute the C# NUnit tests against the running Docker container
          dotnet test ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 11: Save the generated trace.zip files as downloadable artifacts
      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ReleaseRadar.Tests/bin/Debug/net10.0/
          retention-days: 7