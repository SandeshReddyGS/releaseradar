name: ReleaseRadar CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    
    # 1. Setup the ephemeral PostgreSQL database for tests
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Keep Node.js setup if your frontend/backend still require it to run locally in CI
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Setup .NET for your Playwright NUnit tests
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Update to match your project's target framework

      - name: Install Frontend/Backend Dependencies
        run: |
          npm ci
          cd backend
          npm install

      - name: Seed Test Database
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        run: node backend/seed.mjs

      # 4. Restore NuGet packages and Build the C# Test Project
      - name: Build C# Tests
        run: dotnet build ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # 5. Install Playwright Browsers using the pwsh script generated by the build
      - name: Install Playwright Browsers
        run: pwsh ReleaseRadar.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          JWT_SECRET: ci_test_secret
        run: |
          # Start the backend and frontend in the background
          node backend/server.mjs &
          cd frontend
          npm run dev &
          cd ..
          
          # Wait for the frontend to be ready
          npx wait-on http://localhost:5173 || sleep 5
          
          # 6. Execute the C# NUnit tests
          dotnet test ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      - name: Upload Playwright Traces (Optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # Update this path if configured tracing output in C# tests
          path: ReleaseRadar.Tests/bin/Debug/net10.0/
          retention-days: 7