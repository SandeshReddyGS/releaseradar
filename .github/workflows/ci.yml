name: ReleaseRadar CI Pipeline

# Trigger the pipeline automatically whenever code is pushed to these branches
on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-verify:
    # Run the pipeline on a fresh Ubuntu Linux virtual machine
    runs-on: ubuntu-latest
    
    # Background database service container for testing
    services:
      db:
        # Spin up an ephemeral PostgreSQL database container
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Ensure the database is fully healthy and ready to accept connections before proceeding
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download your repository code onto the virtual machine runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js runtime environment for backend and frontend tooling
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install the .NET SDK required to compile and run your C# Playwright tests
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      # Step 4: Install all node dependencies for the root, backend, and frontend packages
      - name: Install Frontend/Backend Dependencies
        run: |
          npm ci
          cd backend
          npm install
          cd ../frontend
          npm install

      # Step 5: Execute your seed script to create tables and insert mock users against localhost Postgres
      - name: Seed Test Database
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        run: node backend/seed.mjs

      # Step 6: Compile the C# test project to verify test syntax and dependencies are correct
      - name: Compile C# Tests
        run: dotnet build ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 7: Download and install the browser binaries needed by Playwright
      - name: Install Playwright Browsers
        run: pwsh ReleaseRadar.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      # Step 8: Build the Docker image to prove that your Dockerfile compiles cleanly without errors
      - name: Build Docker Image (Verification Only)
        run: docker build -t releaseradar-app .

      # Step 9: Spin up the backend and frontend servers natively on localhost and execute E2E tests
      - name: Run E2E Tests
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          JWT_SECRET: ci_test_secret
        run: |
          # Start the Express backend server in the background
          node backend/server.mjs &
          
          # Start the Vite development server in the background
          cd frontend
          npm run dev &
          cd ..
          
          # Wait up to 60 seconds for the Vite server to respond on port 5173
          npx wait-on -t 60000 http://localhost:5173 || sleep 5
          
          # Execute the Playwright test suite against the native localhost servers
          dotnet test ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 10: Collect Playwright trace artifacts if any tests fail for debugging purposes
      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ReleaseRadar.Tests/bin/Debug/net10.0/
          retention-days: 7