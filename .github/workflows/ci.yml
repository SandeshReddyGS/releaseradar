name: ReleaseRadar CI Pipeline

# Trigger the pipeline automatically whenever code is pushed to these branches
on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-verify:
    # Run the pipeline on a fresh Ubuntu Linux virtual machine
    runs-on: ubuntu-latest
    
    # Background services needed before steps run
    services:
      db:
        # Spin up an ephemeral PostgreSQL database container for testing
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Ensure the database is fully booted before proceeding
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download your repository's code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js for backend scripts and frontend tools
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install the .NET 10 SDK required for your C# Playwright tests
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      # Step 4: Install all Node modules for dependency resolution
      - name: Install Frontend/Backend Dependencies
        run: |
          npm ci
          cd backend
          npm install
          cd ../frontend
          npm install

      # Step 5: Fill the test database with dummy data (using localhost since runner talks to service container)
      - name: Seed Test Database
        env:
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
        run: node backend/seed.mjs

      # Step 6: Compile the C# test suite to catch syntax errors early
      - name: Build C# Tests
        run: dotnet build ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 7: Download Playwright's browsers (Chrome, Firefox) for automated clicking
      - name: Install Playwright Browsers
        run: pwsh ReleaseRadar.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      # Step 8: Build the Docker image from your monorepo's multi-stage Dockerfile
      - name: Build Docker Image
        run: docker build -t releaseradar-app .

      # Step 9: Start the Docker container in the background (-d flag)
      # Uses host.docker.internal so the containerized backend connects to the CI's Postgres database,
      # and sets APP_ENV="production" so Express serves the compiled React frontend.
      - name: Run Application Container
        env:
          DATABASE_URL: postgres://testuser:testpassword@host.docker.internal:5432/testdb
          JWT_SECRET: ci_test_secret
        run: |
          docker run -d \
            --add-host=host.docker.internal:host-gateway \
            -p 5173:3000 \
            -p 5000:5000 \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e JWT_SECRET="${{ env.JWT_SECRET }}" \
            -e APP_ENV="production" \
            --name live-app releaseradar-app

      # Step 10: Verify the container is running, then execute C# tests
      - name: Run E2E Tests
        run: |
          # Wait up to 60 seconds for the server to respond on port 5173 to prevent infinite pipeline freezing
          npx wait-on -t 60000 http://localhost:5173 || sleep 5
          
          # Fire the automated Playwright tests against the live Docker container
          dotnet test ReleaseRadar.Tests/ReleaseRadar.Tests.csproj

      # Step 11: If Step 10 fails, print the backend/frontend terminal output to diagnose the crash
      - name: Print Docker Logs on Failure
        if: failure()
        run: docker logs live-app

      # Step 12: Collect the zip files capturing the browser sessions (always runs, even if tests fail)
      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ReleaseRadar.Tests/bin/Debug/net10.0/
          retention-days: 7